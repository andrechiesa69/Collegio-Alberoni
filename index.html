<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esperienza AR Interattiva</title>
    
    <!-- Librerie A-Frame e MindAR per Image Tracking -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        /* Overlay con istruzioni in alto */
        #instruction-overlay {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(0, 0, 0, 0.75);
            color: #fff;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            text-align: center;
            pointer-events: none;
        }

        /* Contenitore dei pulsanti in basso sullo schermo */
        #ui-controls {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            gap: 15px;
        }

        /* Stile dei pulsanti cliccabili */
        .ar-btn {
            background-color: #ffffff;
            color: #1a252c;
            border: 2px solid #f1c40f;
            padding: 12px 20px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: all 0.2s ease;
        }

        .ar-btn:active {
            transform: scale(0.95);
            background-color: #f1c40f;
        }
    </style>
</head>
<body>

    <div id="instruction-overlay">
        Inquadra l'immagine per attivare l'AR
    </div>

    <!-- Pulsanti di navigazione a schermo fisso -->
    <div id="ui-controls">
        <button class="ar-btn" id="btn-facciata">Facciata</button>
        <button class="ar-btn" id="btn-cardinale">Cardinale</button>
        <button class="ar-btn" id="btn-storia">Storia</button>
    </div>

    <a-scene 
        mindar-image="imageTargetSrc: ./targets.mind;" 
        color-space="sRGB" 
        renderer="colorManagement: true, physicallyCorrectLights" 
        vr-mode-ui="enabled: false" 
        device-orientation-permission-ui="enabled: false">
      
        <a-assets>
            <img id="imgFacciata" src="facciata.jpg"> <!-- -->
            <img id="imgCardinale" src="Cardinale.png"> <!--[cite: 9] -->
            <img id="imgStoria" src="storia.png"> <!--[cite: 11] -->
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <!-- Target AR: Si attiva quando inquadri la copertina -->
        <a-entity id="ar-target" mindar-image-target="targetIndex: 0">
            
            <!-- UNICA IMMAGINE AR SOVRAPPOSTA AL CENTRO (Inizialmente la facciata) -->
            <a-image 
                id="main-display"
                src="#imgFacciata" 
                position="0 0 0" 
                height="0.8" 
                width="1" 
                rotation="0 0 0">
            </a-image>

        </a-entity>
    </a-scene>

    <script>
        const mainDisplay = document.querySelector('#main-display');
        const btnFacciata = document.querySelector('#btn-facciata');
        const btnCardinale = document.querySelector('#btn-cardinale');
        const btnStoria = document.querySelector('#btn-storia');

        // Passa all'immagine della Facciata
        btnFacciata.addEventListener('click', () => {
            mainDisplay.setAttribute('src', '#imgFacciata');
        });

        // Passa all'immagine del Cardinale
        btnCardinale.addEventListener('click', () => {
            mainDisplay.setAttribute('src', '#imgCardinale');
        });

        // Passa all'immagine della Storia
        btnStoria.addEventListener('click', () => {
            mainDisplay.setAttribute('src', '#imgStoria');
        });
    </script>

</body>
</html>
