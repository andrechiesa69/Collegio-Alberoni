<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Realtà Aumentata - MindAR</title>

  <!-- A-Frame Library -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  
  <!-- MindAR per A-Frame -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Overlay con indicatore per l'utente */
    #example-scanning-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: rgba(0, 0, 0, 0.6);
      padding: 15px 25px;
      border-radius: 12px;
      color: white;
    }

    .scanline {
      width: 200px;
      height: 200px;
      border: 2px dashed rgba(255, 255, 255, 0.8);
      border-radius: 12px;
      margin-bottom: 10px;
    }

    /* Nasconde l'overlay quando il target viene rilevato */
    #example-scanning-overlay.hidden {
      display: none;
    }
  </style>
</head>
<body>

  <!-- Overlay visivo per la scansione -->
  <div id="example-scanning-overlay">
    <div class="inner">
      <div class="scanline"></div>
      <span>Inquadra l'immagine target</span>
    </div>
  </div>

  <!-- Scena Realtà Aumentata (MindAR) -->
  <!-- Modifica 'imageTargetSrc' specificando il percorso al tuo file .mind -->
  <a-scene 
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: no; uiError: yes; uiScanning: #example-scanning-overlay;" 
    embedded 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">
    
    <a-assets>
      <!-- Risorse e immagini da visualizzare -->
      <img id="cardinale-img" src="Cardinale_3.png">
      <img id="storia-img" src="storia_3.png">
      <img id="facciata-img" src="facciata_3.jpg">
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Target 0 (corrisponde alla prima immagine nel file .mind) -->
    <a-entity mindar-image-target="targetIndex: 0">
      
      <!-- Pannello di sinistra (Storia) -->
      <a-image 
        src="#storia-img" 
        position="-0.7 0 0" 
        height="0.8" 
        width="0.55" 
        rotation="0 0 0">
      </a-image>

      <!-- Immagine centrale (Facciata) -->
      <a-image 
        src="#facciata-img" 
        position="0 0 0" 
        height="0.9" 
        width="0.65" 
        rotation="0 0 0">
      </a-image>

      <!-- Pannello di destra (Cardinale) -->
      <a-image 
        src="#cardinale-img" 
        position="0.7 0 0" 
        height="0.8" 
        width="0.55" 
        rotation="0 0 0">
      </a-image>

    </a-entity>
  </a-scene>

  <script>
    // Listener di eventi per nascondere o mostrare la GUI di scansione
    const overlay = document.querySelector('#example-scanning-overlay');
    const sceneEl = document.querySelector('a-scene');

    sceneEl.addEventListener("targetFound", event => {
      console.log("Target trovato!");
      overlay.classList.add("hidden");
    });

    sceneEl.addEventListener("targetLost", event => {
      console.log("Target perso.");
      overlay.classList.remove("hidden");
    });
  </script>
</body>
</html>
