<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esperienza Realtà Aumentata</title>
    
    <!-- Librerie A-Frame e MindAR per Image Tracking -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
        /* Overlay con istruzioni per l'utente */
        #instruction-overlay {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 10px 20px;
            border-radius: 20px;
            font-family: sans-serif;
            font-size: 14px;
            text-align: center;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="instruction-overlay">
        Inquadra l'immagine/copertina per attivare i contenuti AR
    </div>

    <!-- 
      Scena AR: 
      - imageTargetSrc specifica il file del target compilato (.mind)
      - maxTrack: 1 indica un target attivo
    -->
    <a-scene 
        mindar-image="imageTargetSrc: ./targets.mind;" 
        color-space="sRGB" 
        renderer="colorManagement: true, physicallyCorrectLights" 
        vr-mode-ui="enabled: false" 
        device-orientation-permission-ui="enabled: false">
      
        <a-assets>
            <!-- Immagini da sovrapporre in Realtà Aumentata -->
            <img id="imgCardinale" src="Cardinale.png">
            <img id="imgStoria" src="storia.png">
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <!-- Target 0: Quando la fotocamera riconosce la copertina/target -->
        <a-entity mindar-image-target="targetIndex: 0">
            
            <!-- Immagine del Cardinale visibile sopra il target -->
            <a-image 
                src="#imgCardinale" 
                position="-0.4 0 0.1" 
                height="0.6" 
                width="0.4" 
                rotation="0 0 0">
            </a-image>

            <!-- Immagine della Storia visibile a fianco -->
            <a-image 
                src="#imgStoria" 
                position="0.4 0 0.1" 
                height="0.6" 
                width="0.4" 
                rotation="0 0 0">
            </a-image>

        </a-entity>
    </a-scene>

</body>
</html>
