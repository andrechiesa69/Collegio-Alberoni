<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Realtà Aumentata - Test MindAR</title>

  <!-- Libreria A-Frame -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  
  <!-- Libreria MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #000;
    }

    /* Interfaccia utente con il rettangolo di scansione overlay */
    #scanning-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .scan-box {
      width: 250px;
      height: 250px;
      border: 3px dashed #00ffcc;
      border-radius: 16px;
      box-shadow: 0 0 15px rgba(0, 255, 204, 0.4);
      margin-bottom: 20px;
    }

    .scan-text {
      background: rgba(0, 0, 0, 0.7);
      color: #ffffff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
    }

    /* Classe usata da JS per nascondere l'overlay una volta trovato il target */
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <!-- Mirino/Target di Scansione sovrapposto -->
  <div id="scanning-overlay">
    <div class="scan-box"></div>
    <div class="scan-text">Inquadra l'immagine target</div>
  </div>

  <!-- Scena MindAR -->
  <!-- Utilizza un target online di prova (card di un procione/card) -->
  <a-scene 
    mindar-image="imageTargetSrc: https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@v1.2.2/examples/image-tracking/assets/card-example/card.mind; autoStart: true; uiLoading: no; uiScanning: #scanning-overlay;" 
    embedded 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights: true" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">
    
    <a-assets>
      <img id="cardinale-img" src="Cardinale_3.png">
      <img id="storia-img" src="storia_3.png">
      <img id="facciata-img" src="facciata_3.jpg">
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Target index 0 -->
    <a-entity mindar-image-target="targetIndex: 0">
      
      <!-- Scheda Sinistra -->
      <a-image 
        src="#storia-img" 
        position="-0.65 0 0" 
        height="0.75" 
        width="0.5" 
        rotation="0 0 0">
      </a-image>

      <!-- Immagine Centrale -->
      <a-image 
        src="#facciata-img" 
        position="0 0 0" 
        height="0.85" 
        width="0.6" 
        rotation="0 0 0">
      </a-image>

      <!-- Scheda Destra -->
      <a-image 
        src="#cardinale-img" 
        position="0.65 0 0" 
        height="0.75" 
        width="0.5" 
        rotation="0 0 0">
      </a-image>

    </a-entity>
  </a-scene>

  <script>
    const overlay = document.getElementById('scanning-overlay');
    const sceneEl = document.querySelector('a-scene');

    // Quando il target viene agganciato
    sceneEl.addEventListener("targetFound", () => {
      overlay.classList.add("hidden");
    });

    // Quando il target viene perso
    sceneEl.addEventListener("targetLost", () => {
      overlay.classList.remove("hidden");
    });
  </script>
</body>
</html>
